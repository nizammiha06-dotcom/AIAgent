name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Project zip খোলো (ঠিক একটি zip থাকতে হবে)
        run: |
          COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "❌ Repository-তে ঠিক ১টি zip থাকতে হবে, এখন আছে: $COUNT"
            ls -la *.zip 2>/dev/null || true
            exit 1
          fi
          ZIP=$(ls *.zip)
          echo "Zip ফাইল: $ZIP"
          unzip -o "$ZIP" -d .

      - name: JDK 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK platform ও build-tools নিশ্চিত করো
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Gradle 8.10.2 সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Debug APK বানাও
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: ভুলের সারাংশ (ব্যর্থ হলে)
        if: failure()
        run: |
          {
            echo "## Build ব্যর্থ, ভুলের তালিকা"
            echo '```'
            grep -E "^e: |What went wrong|error:|Execution failed" -A2 build.log | head -n 150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build log upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
